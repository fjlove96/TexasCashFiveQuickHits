name: Update Texas Cash 5 CSV

on:
  schedule:
    - cron: '0 5 * * *' # Daily at 5:00 AM UTC (Early morning check)
    - cron: '0 14 * * *' # Daily at 2:00 PM UTC (Midday check in case site is slow to update)
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update_cashfive.py

      - name: Commit and push if changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add cashfive.csv
          git diff --staged --quiet || (git commit -m "Auto-update Cash 5 CSV with latest draw" && git push)
