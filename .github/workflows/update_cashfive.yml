name: Update Texas Cash 5 CSV

on:
  schedule:
    - cron: '42 3 * * *' # 30 mins after 10:12 PM CT draw (CDT)
    - cron: '12 4 * * *' # 60 mins after draw (CDT) / 30 mins after (CST)
    - cron: '42 4 * * *' # 30 mins after draw (CST)
    - cron: '12 5 * * *' # 60 mins after draw (CST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Fetch Script
        run: |
          python update_cashfive.py

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cashfive.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Texas Cash 5 draws" && git push)

      - name: Upload updated CSV to Cloudflare R2
        run: |
          pip install awscli
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws s3 cp cashfive.csv s3://texas-cash-five/cashfive.csv --endpoint-url ${{ secrets.R2_ENDPOINT }}
