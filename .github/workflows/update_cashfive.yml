name: Update Texas Cash 5 CSV

on:
  schedule:
    - cron: '42 3 * * *' # 30 mins after 10:12 PM CT draw (CDT)
    - cron: '12 4 * * *' # 60 mins after draw (CDT) / 30 mins after (CST)
    - cron: '42 4 * * *' # 30 mins after draw (CST)
    - cron: '12 5 * * *' # 60 mins after draw (CST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: python update_cashfive.py

      - name: Commit and push if changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add cashfive.csv
          git diff --staged --quiet || (git commit -m "Auto-update Cash 5 CSV with latest draw" && git push origin main)

      - name: Push CSV to Cloudflare Worker
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -X POST "https://crimson-water-8a64.restless-brook-5368.workers.dev/" \
               -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
               --data-binary @cashfive.csv
